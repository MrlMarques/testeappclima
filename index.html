<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clima Pro</title>
    
    <!-- Configurações para iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Clima Pro">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            /* Nova Paleta de Cores: Preto, Dourado, Branco */
            --bg-color: #000000;             /* Fundo Preto Total */
            --card-bg: rgba(255, 255, 255, 0.05); /* Vidro extremamente escuro */
            --border-color: rgba(255, 215, 0, 0.2); /* Borda dourada bem sutil */
            --text-main: #ffffff;            /* Branco Puro */
            --text-muted: #b0b0b0;           /* Cinza claro para secundários */
            --accent-gold: #ffd700;          /* Dourado Amarelo */
            --gold-gradient: linear-gradient(135deg, #000000, #434343); /* Gradiente de fundo alternativo se preferir */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Container principal das telas */
        .app-container { flex: 1; overflow-y: auto; padding: 20px 20px 90px 20px; display: flex; flex-direction: column; align-items: center; }
        
        .tab-content { display: none; width: 100%; max-width: 400px; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: flex; flex-direction: column; align-items: center; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Cartões e Layout */
        .card { background: var(--card-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 24px; padding: 25px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--border-color); margin-bottom: 20px; text-align: center; }
        
        h1 { font-size: 22px; font-weight: 600; margin-bottom: 15px; color: var(--text-main); }
        .temp { font-size: 64px; font-weight: bold; margin: 15px 0; letter-spacing: -2px; color: var(--accent-gold); text-shadow: 0 2px 10px rgba(255,215,0,0.3);}
        .desc { font-size: 17px; text-transform: capitalize; margin-bottom: 20px; opacity: 0.9; color: var(--text-muted);}
        
        .details { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; border-top: 1px solid var(--border-color); padding-top: 15px; font-size: 14px; color: var(--text-muted); }
        .detail-item { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; }
        .detail-item strong { color: var(--text-main); font-size: 16px;}

        /* Elementos de Formulário */
        .search-box { display: flex; gap: 10px; width: 100%; margin-bottom: 20px; }
        input { flex: 1; padding: 14px; border-radius: 14px; border: 1px solid var(--border-color); outline: none; background: rgba(20, 20, 20, 0.6); color: var(--text-main); font-size: 16px; }
        input::placeholder { color: rgba(255,255,255,0.4); }
        input:focus { border-color: var(--accent-gold); box-shadow: 0 0 10px rgba(255,215,0,0.2);}
        
        button { padding: 14px 20px; border-radius: 14px; border: none; background: var(--accent-gold); color: #000; font-weight: bold; cursor: pointer; font-size: 15px; transition: all 0.2s; }
        button:active { transform: scale(0.97); opacity: 0.9; }

        /* Lista de Favoritos */
        .fav-list { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .fav-item { background: var(--card-bg); padding: 15px 20px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); cursor: pointer; transition: background 0.2s;}
        .fav-item:active { background: rgba(255, 215, 0, 0.1); }
        .fav-item span { font-weight: 500; font-size: 16px; color: var(--text-main); }
        .btn-del { background: rgba(231, 76, 60, 0.1); color: #ff6b6b; padding: 8px 12px; border-radius: 10px; font-size: 13px; border: 1px solid rgba(231, 76, 60, 0.3);}
        .btn-del:active { background: rgba(231, 76, 60, 0.3); }

        /* Barra de Navegação Inferior (Estilo iOS Premium) */
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 1000; }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex: 1; padding: 10px 0; transition: all 0.2s; box-shadow: none; }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; transition: fill 0.2s; }
        
        /* Item Ativo (Dourado) */
        .nav-item.active { color: var(--accent-gold); font-weight: 600; }
        .nav-item.active svg { fill: var(--accent-gold); filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5)); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- ABA 1: CLIMA ATUAL -->
        <div id="tab-clima" class="tab-content active">
            <div class="search-box">
                <input type="text" id="cityInput" placeholder="Buscar cidade...">
                <button onclick="buscarPorTexto()">Buscar</button>
            </div>
            
            <div class="card">
                <h1 id="cityName">Carregando...</h1>
                <div class="temp" id="tempValue">--°C</div>
                <div class="desc" id="weatherDesc">Aguardando dados</div>
                
                <div class="details">
                    <div class="detail-item">Umidade<br><strong id="humidity">--</strong>%</div>
                    <div class="detail-item">Vento<br><strong id="wind">--</strong> km/h</div>
                </div>
            </div>
            <button onclick="salvarFavorito()" style="width: 100%; background: rgba(255,255,255,0.15); border: 1px solid var(--border-color);">⭐ Salvar nos Favoritos</button>
        </div>

        <!-- ABA 2: FAVORITOS -->
        <div id="tab-favoritos" class="tab-content">
            <h2 style="font-size: 20px; margin-bottom: 20px; align-self: flex-start;">Cidades Salvas</h2>
            <div id="favListContainer" class="fav-list">
                <!-- Preenchido via JavaScript -->
            </div>
        </div>

        <!-- ABA 3: CONFIGURAÇÕES / SOBRE -->
        <div id="tab-config" class="tab-content">
            <div class="card" style="text-align: left;">
                <h1 style="margin-bottom: 15px;">Sobre o App</h1>
                <p style="font-size: 14px; opacity: 0.8; line-height: 1.6; margin-bottom: 15px;">
                    Este é um Progressive Web App (PWA) profissional desenvolvido para iOS, estruturado para rodar com navegação nativa e suporte offline.
                </p>
                <div style="font-size: 13px; opacity: 0.6;">Versão 2.0.0 Pro</div>
            </div>
        </div>

    </div>

    <!-- BARRA DE NAVEGAÇÃO INFERIOR -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="mudarAba('clima', this)">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            Clima
        </button>
        <button class="nav-item" onclick="mudarAba('favoritos', this)">
            <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            Favoritos
        </button>
        <button class="nav-item" onclick="mudarAba('config', this)">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            Ajustes
        </button>
    </nav>

    <script>
        let cidadeAtualNome = "São Paulo";

        // Sistema de Abas
        function mudarAba(abaId, elementoBtn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + abaId).classList.add('active');
            elementoBtn.classList.add('active');

            if(abaId === 'favoritos') {
                renderizarFavoritos();
            }
        }

        // Lógica de Clima
        async function buscarClimaPorNome(cidade) {
            try {
                let geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cidade)}&count=1&language=pt&format=json`);
                let geoData = await geoRes.json();

                if (!geoData.results || geoData.results.length === 0) {
                    alert("Cidade não encontrada!");
                    return;
                }

                let lugar = geoData.results[0];
                cidadeAtualNome = `${lugar.name}, ${lugar.country}`;
                document.getElementById('cityName').innerText = cidadeAtualNome;

                let weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lugar.latitude}&longitude=${lugar.longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`);
                let weatherData = await weatherRes.json();

                let current = weatherData.current;
                document.getElementById('tempValue').innerText = `${Math.round(current.temperature_2m)}°C`;
                document.getElementById('humidity').innerText = current.relative_humidity_2m;
                document.getElementById('wind').innerText = current.wind_speed_10m;
                
                let descText = "Céu limpo";
                if (current.weather_code > 0 && current.weather_code < 3) descText = "Parcialmente nublado";
                if (current.weather_code >= 3) descText = "Nublado / Chuvoso";
                document.getElementById('weatherDesc').innerText = descText;

            } catch (error) {
                console.error(error);
            }
        }

        function buscarPorTexto() {
            let val = document.getElementById('cityInput').value;
            if(val) buscarClimaPorNome(val);
        }

        // Gerenciamento de Favoritos (Local Storage)
        function salvarFavorito() {
            let favs = JSON.parse(localStorage.getItem('favs') || '[]');
            if(!favs.includes(cidadeAtualNome)) {
                favs.push(cidadeAtualNome);
                localStorage.setItem('favs', JSON.stringify(favs));
                alert("Cidade salva nos favoritos!");
            } else {
                alert("Esta cidade já está nos favoritos.");
            }
        }

        function renderizarFavoritos() {
            let container = document.getElementById('favListContainer');
            let favs = JSON.parse(localStorage.getItem('favs') || '[]');
            
            if(favs.length === 0) {
                container.innerHTML = `<p style="opacity: 0.6; text-align: center; margin-top: 20px;">Nenhuma cidade salva ainda.</p>`;
                return;
            }

            container.innerHTML = '';
            favs.forEach((cidade, index) => {
                let div = document.createElement('div');
                div.className = 'fav-item';
                div.innerHTML = `
                    <span onclick="carregarFavorito('${cidade}')">${cidade}</span>
                    <button class="btn-del" onclick="removerFavorito(${index})">Remover</button>
                `;
                container.appendChild(div);
            });
        }

        function carregarFavorito(cidade) {
            document.getElementById('cityInput').value = cidade.split(',')[0];
            buscarClimaPorNome(cidade.split(',')[0]);
            document.querySelector('.nav-item').click(); // Volta para a aba clima
        }

        function removerFavorito(index) {
            let favs = JSON.parse(localStorage.getItem('favs') || '[]');
            favs.splice(index, 1);
            localStorage.setItem('favs', JSON.stringify(favs));
            renderizarFavoritos();
        }

        // Inicialização
        window.onload = () => {
            buscarClimaPorNome("São Paulo");
            
            // Registro do Service Worker para PWA
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js');
            }
        };
    </script>
</body>
</html>
