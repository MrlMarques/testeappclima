<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Previsão do Tempo</title>
    
    <!-- Configurações essenciais para o iOS tratar como App Nativo -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ClimaApp">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Estilos visuais modernos -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #2c3e50, #3498db); color: #fff; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); border: 1px solid rgba(255, 255, 255, 0.18); }
        h1 { font-size: 24px; margin-bottom: 10px; font-weight: 600; }
        .temp { font-size: 64px; font-weight: bold; margin: 20px 0; }
        .desc { font-size: 18px; text-transform: capitalize; margin-bottom: 20px; opacity: 0.9; }
        .details { display: flex; justify-content: space-around; font-size: 14px; opacity: 0.8; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px; }
        .search-box { margin-bottom: 20px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 10px; border: none; outline: none; background: rgba(255,255,255,0.2); color: #fff; font-size: 16px; }
        input::placeholder { color: #ddd; }
        button { padding: 12px 20px; border-radius: 10px; border: none; background: #27ae60; color: #fff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Nome da cidade..." value="São Paulo">
            <button onclick="buscarClima()">Buscar</button>
        </div>
        
        <h1 id="cityName">Carregando...</h1>
        <div class="temp" id="tempValue">--°C</div>
        <div class="desc" id="weatherDesc">Aguardando dados</div>
        
        <div class="details">
            <div>Umidade: <span id="humidity">--</span>%</div>
            <div>Vento: <span id="wind">--</span> km/h</div>
        </div>
    </div>

    <script>
        async function buscarClima() {
            const cidade = document.getElementById('cityInput').value;
            if (!cidade) return;

            try {
                // Usando API pública gratuita de geolocalização e clima (Open-Meteo)
                let geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cidade)}&count=1&language=pt&format=json`);
                let geoData = await geoRes.json();

                if (!geoData.results || geoData.results.length === 0) {
                    alert("Cidade não encontrada!");
                    return;
                }

                let lugar = geoData.results[0];
                document.getElementById('cityName').innerText = `${lugar.name}, ${lugar.country}`;

                let weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lugar.latitude}&longitude=${lugar.longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`);
                let weatherData = await weatherRes.json();

                let current = weatherData.current;
                document.getElementById('tempValue').innerText = `${Math.round(current.temperature_2m)}°C`;
                document.getElementById('humidity').innerText = current.relative_humidity_2m;
                document.getElementById('wind').innerText = current.wind_speed_10m;
                
                // Tradução simples de código de clima do Open-Meteo
                let descText = "Céu limpo";
                if (current.weather_code > 0 && current.weather_code < 3) descText = "Parcialmente nublado";
                if (current.weather_code >= 3) descText = "Nublado / Chuvoso";
                document.getElementById('weatherDesc').innerText = descText;

            } catch (error) {
                console.error(error);
                alert("Erro ao buscar dados do clima.");
            }
        }

        // Executa ao abrir
        window.onload = buscarClima;
    </script>
</body>
</html>
